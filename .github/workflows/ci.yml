name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Some security setups skip the classic hooks without a word: a plugin that depended on one would stop working.
      - name: No classic hooks
        shell: pwsh
        run: |
          $hits = Select-String -Path hooks/*.ts, hooks/*.tsx -Pattern 'classic\.'
          if ($hits) {
            $hits | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # On CI the real Recycle Bin is tried too (a file and a folder made for the test).
      - name: The files, the server and the commands
        run: node --test "tests/*.test.mjs"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # A name Claude Code ships is only a warning for a command, but the command is then never registered.
      - name: Validate
        shell: pwsh
        run: |
          $output = claude plugin validate . 2>&1 | Out-String
          $output
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($output -match 'is a name Claude Code ships') { Write-Error 'A command name is one Claude Code ships: rename it.'; exit 1 }

      - name: Test
        run: claude plugin test .

  # The same files, on the systems where the trash is another tool (stood in for in the tests).
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The files, the server and the commands
        run: node --test "tests/*.test.mjs"
